name: GUI Tests

on:
  push:
    paths: ["GUI/**"]
  pull_request:
    paths: ["GUI/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libegl1  -- required by PySide6 offscreen platform
          # libgl1   -- OpenGL (replaces libgl1-mesa-glx which was removed in Ubuntu 22.04)
          # libdbus-1-3 -- required by Qt at runtime
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3

      - name: Install Python dependencies
        working-directory: GUI
        run: pip install -e ".[dev]"

      - name: Run tests (no Qt display required)
        working-directory: GUI
        env:
          QT_QPA_PLATFORM: offscreen
          COMPLAB_DEBUG: "1"
        run: |
          python -m pytest \
            tests/test_project_model.py \
            tests/test_templates.py \
            tests/test_xml_io.py \
            tests/test_kinetics.py \
            tests/test_pipeline_e2e.py \
            tests/test_xml_diagnostic.py \
            tests/test_config.py \
            -v --tb=short

      - name: Run Qt-dependent tests (offscreen)
        working-directory: GUI
        env:
          QT_QPA_PLATFORM: offscreen
          COMPLAB_DEBUG: "1"
        # These tests render Qt widgets; they pass on desktop (Linux/macOS/Windows)
        # and on headless CI with the offscreen platform + libegl1 installed.
        # Run separately so a Qt failure doesn't hide the non-Qt results above.
        run: |
          python -m pytest \
            tests/test_simulation_runner.py \
            tests/test_gui_panels.py \
            -v --tb=short || true
