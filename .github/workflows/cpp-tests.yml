name: C++ Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/cpp/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp-tests.yml'
      - 'defineKinetics.hh'
      - 'defineAbioticKinetics.hh'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/cpp/**'
      - 'CMakeLists.txt'
      - 'defineKinetics.hh'
      - 'defineAbioticKinetics.hh'
  workflow_dispatch:

jobs:
  cpp-tests:
    name: GoogleTest (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Select compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure (CMake)
        working-directory: tests/cpp
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: tests/cpp
        run: cmake --build build --parallel

      - name: Run tests (ctest)
        working-directory: tests/cpp/build
        run: ctest --output-on-failure --parallel 2

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}-${{ matrix.compiler }}
          path: tests/cpp/build/Testing/
